name: Catalog health

on:
  schedule:
    - cron: '17 6 * * 1'   # her Pazartesi 06:17 UTC
  workflow_dispatch:

jobs:
  check-catalog:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    # Qt gerekmez: katalog modulu yalnizca stdlib kullanir.
    - name: Check catalog URLs
      run: |
        python -m mibox_app.catalog_health --verify-hash
