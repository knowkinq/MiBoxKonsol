name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12 (64-bit)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.22.3

    - name: Verify tag matches application version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $version = python -c "from mibox_app import __version__; print(__version__)"
        if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag v$version does not match $env:GITHUB_REF_NAME" }

    - name: Download verified Android ADB
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'platform-tools_r37.0.1-win.zip'
        $extract = Join-Path $env:RUNNER_TEMP 'mibox-platform-tools'
        $url = 'https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip'
        $expectedSha256 = '45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99'
        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256) { throw 'Android Platform-Tools SHA-256 verification failed' }
        Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
        $adbSource = Join-Path $extract 'platform-tools'
        if (-not (Test-Path (Join-Path $adbSource 'adb.exe'))) { throw 'adb.exe was not found in the verified archive' }
        if (-not (Select-String -Path (Join-Path $adbSource 'source.properties') -Pattern '^Pkg.Revision=37\.0\.1$' -Quiet)) {
          throw 'Unexpected Android Platform-Tools version'
        }

    - name: Build Portable Folder Package (x64)
      shell: pwsh
      run: |
        $adbSource = Join-Path $env:RUNNER_TEMP 'mibox-platform-tools\platform-tools'
        python tools/build_onedir.py --adb-source $adbSource
        if ($LASTEXITCODE -ne 0) { throw 'Portable package build failed' }

    - name: Verify Packaged Application
      shell: pwsh
      run: |
        $exe = '.\dist-onedir\MiBoxKonsol\MiBoxKonsol.exe'
        if (-not (Test-Path $exe)) { throw 'Packaged executable was not created' }
        $adb = '.\dist-onedir\MiBoxKonsol\platform-tools\adb.exe'
        $adbFiles = @(
          $adb,
          '.\dist-onedir\MiBoxKonsol\platform-tools\AdbWinApi.dll',
          '.\dist-onedir\MiBoxKonsol\platform-tools\AdbWinUsbApi.dll',
          '.\dist-onedir\MiBoxKonsol\platform-tools\NOTICE.txt'
        )
        foreach ($file in $adbFiles) { if (-not (Test-Path $file)) { throw "Bundled ADB file missing: $file" } }
        $adbVersion = (& $adb --version 2>&1) -join "`n"
        if ($LASTEXITCODE -ne 0 -or $adbVersion -notmatch 'Version 37\.0\.1') { throw 'Bundled ADB version check failed' }
        $report = Join-Path $env:RUNNER_TEMP 'mibox-version.txt'
        $versionCheck = Start-Process -FilePath $exe -ArgumentList '--version', '--report-file', "`"$report`"" -PassThru -Wait -WindowStyle Hidden
        if ($versionCheck.ExitCode -ne 0) { throw "Version check failed with exit code $($versionCheck.ExitCode)" }
        if (-not (Test-Path $report)) { throw 'Packaged application did not write a version report' }
        $expectedVersion = python -c "from mibox_app import __version__; print(__version__)"
        if (-not (Get-Content $report -Raw).Contains("MiBox Konsol v$expectedVersion")) { throw 'Packaged version report does not match the source version' }
        $env:QT_QPA_PLATFORM = 'offscreen'
        $selftest = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait -WindowStyle Hidden
        if ($selftest.ExitCode -ne 0) { throw "Packaged application selftest failed with exit code $($selftest.ExitCode)" }
        $marker = '.\dist-onedir\MiBoxKonsol\mibox-selftest-ok.txt'
        if (-not (Test-Path $marker)) { throw 'Packaged application selftest marker was not created' }
        python tools/build_onedir.py --clean-package
        if ($LASTEXITCODE -ne 0) { throw 'Could not remove runtime data from the release package' }

    - name: Create Portable ZIP and SHA-256 Checksum
      shell: pwsh
      run: |
        $package = (Resolve-Path '.\dist-onedir\MiBoxKonsol').Path
        $archive = Join-Path $PWD 'dist-onedir\MiBoxKonsol-Windows-x64.zip'
        Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -CompressionLevel Optimal
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        [System.IO.File]::WriteAllText("$archive.sha256", "$hash  MiBoxKonsol-Windows-x64.zip`n", [System.Text.Encoding]::ASCII)

    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: MiBoxKonsol-Windows-x64
        path: |
          dist-onedir/MiBoxKonsol-Windows-x64.zip
          dist-onedir/MiBoxKonsol-Windows-x64.zip.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Verified Build Artifact
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: MiBoxKonsol-Windows-x64
        path: release-assets

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          release-assets/MiBoxKonsol-Windows-x64.zip
          release-assets/MiBoxKonsol-Windows-x64.zip.sha256
        generate_release_notes: true
