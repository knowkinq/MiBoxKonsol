name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12 (64-bit)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.22.3

    - name: Verify tag matches application version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $version = python -c "from mibox_app import __version__; print(__version__)"
        if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag v$version does not match $env:GITHUB_REF_NAME" }

    - name: Build Standalone Executable (x64)
      run: |
        python -m PyInstaller --noconfirm MiBoxKonsol.spec

    - name: Test Built Executable
      run: |
        .\dist\MiBoxKonsol.exe --version

    - name: Generate SHA-256 checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash .\dist\MiBoxKonsol.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        [System.IO.File]::WriteAllText((Join-Path $PWD 'dist\MiBoxKonsol.exe.sha256'), "$hash  MiBoxKonsol.exe`n", [System.Text.Encoding]::ASCII)

    - name: Upload Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: MiBoxKonsol-Windows-x64
        path: |
          dist/MiBoxKonsol.exe
          dist/MiBoxKonsol.exe.sha256

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          dist/MiBoxKonsol.exe
          dist/MiBoxKonsol.exe.sha256
        generate_release_notes: true
